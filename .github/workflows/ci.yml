name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promocionar:
        description: 'SHA de la imagen a promocionar a prod'
        required: false
permissions:
  contents: read

env:
  TZ: UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  # Revisión de las dependencias que añade o cambia el PR, con la base de avisos de GitHub (ADR-16). Bloquea las
  # vulnerabilidades altas o críticas de ejecución y las críticas de desarrollo; el resto aparece como aviso.
  # allow-ghsas = descartes vigentes de la tabla de excepciones de la ADR-16 (EXC-01 y EXC-06).
  dependencias:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Ejecución (bloquea altas y críticas)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 #v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          allow-ghsas: GHSA-gcqx-w48m-w2h4, GHSA-g3hv-75wg-m249
          comment-summary-in-pr: on-failure
      - name: Desarrollo (bloquea críticas)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 #v5.0.0
        with:
          fail-on-severity: critical
          fail-on-scopes: development
          allow-ghsas: GHSA-gcqx-w48m-w2h4, GHSA-g3hv-75wg-m249
          comment-summary-in-pr: on-failure
      - name: Avisos (medias y bajas, y altas de desarrollo; no bloquea)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 #v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development
          allow-ghsas: GHSA-gcqx-w48m-w2h4, GHSA-g3hv-75wg-m249
          warn-only: true

  linting:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Super-linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          TERRAFORM_TFLINT_CONFIG_FILE: .tflint.custom.hcl
          VALIDATE_JSCPD: false
          VALIDATE_CHECKOV: false
          VALIDATE_CLOUDFORMATION: false
          VALIDATE_TERRAFORM_TERRASCAN: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_MARKDOWN_PRETTIER: false
          FIX_YAML_PRETTIER: true
          VALIDATE_CSS: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_TRIVY: false
          FIX_TERRAFORM_FMT: true
          FILTER_REGEX_EXCLUDE: (.*github/linters.*|.*CHANGELOG.md.*|.*specify/.*|.*specs/.*|.*apps/api/openapi\.json|.*docs/ref/.*)
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.js
          TYPESCRIPT_ES_CONFIG_FILE: eslint.config.js
          VALIDATE_SPELL_CODESPELL: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          SAVE_SUPER_LINTER_SUMMARY: true

  calidad:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Los XML de CIMAVet no se versionan: se descargan de CIMAVet (caché semanal para no
      # descargarlos en cada ejecución).
      - id: semana
        run: echo "clave=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: fixtures/nomenclator/*.xml
          key: nomenclator-${{ steps.semana.outputs.clave }}
      # Script de la raíz: con los filtros de arriba ningún paquete lo tiene y el paso no descargaba nada.
      - run: pnpm nomenclator:fetch --si-falta
      - run: pnpm --filter '!./.github/**' --filter '!./.claude/**' lint
      - run: pnpm --filter '!./.github/**' --filter '!./.claude/**' typecheck
      - run: pnpm --filter '!./.github/**' --filter '!./.claude/**' test
      - name: Integración (Testcontainers, PostgreSQL 16)
        run: pnpm --filter '!./.github/**' --filter '!./.claude/**' test:int
      - run: pnpm --filter '!./.github/**' --filter '!./.claude/**' build
      - name: Test de humo de la UI (Playwright)
        run: |
          pnpm --filter @mmx/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  imagen:
    name: Imagen a GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: calidad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.meta.outputs.imagen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.imagen }}

  # Despliegue sobre el entorno np (infra/np): app `azu-ca-<sufijo>-01` y jobs `azu-caj-<job>-np`, que solo
  # descargan imágenes del ACR compartido con su identidad gestionada. La imagen de GHCR se importa al ACR como
  # `mmx-recetas:<sha>`. Los nombres reales no se versionan (repositorio público): son variables del entorno de
  # GitHub (Settings › Environments) con los valores de Confluence (PreVetCheck › Infraestructura np):
  #   AZURE_RESOURCE_GROUP  grupo del proyecto (app y jobs)
  #   ACA_APP               nombre de la Container App
  #   ACR_NAME              nombre del ACR compartido
  #   ACR_SERVER            servidor de inicio de sesión del ACR (<acr>-<hash>.azurecr.io)
  #   ACA_JOB_SUFFIX        sufijo de los jobs (opcional; por defecto `np`)
  # La identidad federada de GitHub necesita poder importar en el ACR y actualizar la app y los jobs del grupo.
  dev:
    name: Despliegue a dev
    needs: imagen
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.ACA_APP }}
      ACR: ${{ vars.ACR_NAME }}
      ACR_SERVER: ${{ vars.ACR_SERVER }}
      JOB_SUFFIX: ${{ vars.ACA_JOB_SUFFIX || 'np' }}
      SHA: ${{ github.sha }}
      ORIGEN: ${{ needs.imagen.outputs.imagen }}
    steps:
      - name: Comprobar la configuración del entorno
        run: |
          faltan=""
          for v in RG APP ACR ACR_SERVER; do [ -n "${!v}" ] || faltan="$faltan $v"; done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan variables del entorno 'dev' en GitHub:$faltan (ver comentario del job en ci.yml)"
            exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Importar la imagen al ACR
        run: |
          az acr import -n "$ACR" --source "$ORIGEN" --image "mmx-recetas:${SHA}" \
            --username "${GITHUB_ACTOR}" --password "${GHCR_TOKEN}" --force
          echo "IMAGEN=${ACR_SERVER}/mmx-recetas:${SHA}" >> "$GITHUB_ENV"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Migraciones antes de activar la nueva revisión
        run: |
          job="azu-caj-db-migrate-${JOB_SUFFIX}"
          az containerapp job update -g "$RG" -n "$job" --image "$IMAGEN" -o none
          ejecucion=$(az containerapp job start -g "$RG" -n "$job" --query name -o tsv)
          echo "Ejecución: $ejecucion"
          for i in $(seq 1 60); do
            estado=$(az containerapp job execution show -g "$RG" -n "$job" --job-execution-name "$ejecucion" --query properties.status -o tsv)
            echo "Estado actual: $estado (intento $i/60)"
            case "$estado" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Las migraciones han terminado en $estado"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Las migraciones no han terminado en 10 minutos"
          exit 1
      - name: Actualizar app y jobs
        run: |
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGEN" -o none
          for j in cimavet-delta cimavet-full outbox-dispatcher sales-reconciliation weekly-reports retention-sweep nomenclator-import procedimiento-cargar import-fix; do
            az containerapp job update -g "$RG" -n "azu-caj-${j}-${JOB_SUFFIX}" --image "$IMAGEN" -o none
          done

  prod:
    name: Promoción a prod (aprobación manual)
    if: github.event_name == 'workflow_dispatch' && inputs.promocionar != ''
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}:${INPUTS_PROMOCIONAR}"
          az containerapp job update -g rg-mmx-recetas-prod -n job-db-migrate --image "$IMG"
          az containerapp job start -g rg-mmx-recetas-prod -n job-db-migrate
          sleep 60
          az containerapp update -g rg-mmx-recetas-prod -n mmx-api --image "$IMG"
          for j in cimavet-delta cimavet-full outbox-dispatcher sales-reconciliation weekly-reports retention-sweep nomenclator-import; do
            az containerapp job update -g rg-mmx-recetas-prod -n "job-$j" --image "$IMG"
          done
        env:
          INPUTS_PROMOCIONAR: ${{ inputs.promocionar }}
