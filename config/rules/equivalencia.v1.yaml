# Parámetros de la comparación de indicaciones en la equivalencia (SPEC §4.4.2 punto 6).
# COINCIDE si la similitud ≥ umbral_coincide; PROBABLE si ≥ umbral_probable (exige
# confirmación expresa del garante); si no, NO_COINCIDE.
version: equivalencia.v1
indicacion:
  umbral_coincide: 0.8
  umbral_probable: 0.4
  palabras_vacias: [de, del, la, el, los, las, y, o, en, por, para, con, a, al, causada, causadas, causado, causados, producida, producidas, producido, producidos, infecciones, infeccion, tratamiento]
  sinonimos:
    - [otitis externa, otitis]
    - [piodermitis, pioderma]
    - [cistitis, infeccion urinaria, infecciones del tracto urinario]
    - [dermatitis, dermatitis bacteriana]
