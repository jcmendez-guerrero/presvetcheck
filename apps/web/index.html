<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#016581" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <title>Recetas · Mundo Mascotix</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('mmx-tema-ui');
          var prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (tema === 'oscuro' || ((!tema || tema === 'sistema') && prefiereOscuro)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
